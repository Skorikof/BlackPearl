[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blackpearl"
version = "0.1.0"
description = "Universal media downloader"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "mutagen>=1.48.1",
    "pillow>=13.0.0",
    "pyside6>=6.8",
    "python-dotenv>=1.2.4",
    "yandex-music>=3.2.2",
    "yt-dlp>=2026.10.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
